name: P7 CI Evidence Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  p7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Fresh install
        run: npm ci --no-audit --fund=false
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Secret guard
        run: npm run guard:secrets
      - name: Cloud mutation guard
        run: npm run guard:cloud
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:contract
      - name: Preserve PASS 4 integration tests
        run: npm run test:integration
      - name: Preserve P2 runtime smoke
        run: npm run test:p2-smoke
      - name: Full Jest regression
        run: npm test
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Preserve PASS 5 Chromium E2E
        run: npm run test:e2e
      - name: Preserve PASS 6 deterministic failure injection
        run: npm run test:failure-injection
      - name: Generate PASS 7 CI evidence
        run: npm run evidence:generate
      - name: Verify PASS 7 evidence contract
        run: >-
          node -e "const fs=require('node:fs');
          const p='artifacts/p7/evidence-summary.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.schemaVersion!==1||x.total!==5||x.passed!==5||x.failed!==0)
          process.exit(1);"
      - name: Upload PASS 7 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: p7-ci-evidence-${{ github.sha }}
          path: artifacts/p7/
          if-no-files-found: error
          retention-days: 14

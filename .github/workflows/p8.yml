name: P8 Evidence UI Release Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  p8:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Fresh install
        run: npm ci --no-audit --fund=false

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Preserve P0-P7 and verify PASS 8 Evidence UI
        run: npm run qa:p8

      - name: Upload PASS 8 static release bundle
        uses: actions/upload-artifact@v4
        with:
          name: p8-evidence-ui-${{ github.sha }}
          path: apps/evidence-ui/dist/
          if-no-files-found: error
          retention-days: 14
